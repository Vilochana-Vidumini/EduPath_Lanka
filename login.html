<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <title>Login | EduPath Lanka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page login-page">
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Home</a>

    <main class="auth-shell" aria-label="Login">
        <section class="auth-card login-card">
            <div class="brand-mark" aria-label="EduPath Lanka">
                <span class="brand-icon"><i class="fas fa-graduation-cap" aria-hidden="true"></i></span>
                <span>EduPath <strong>Lanka</strong></span>
            </div>

            <div class="form-header">
                <h1>Welcome Back</h1>
                <p>Continue your learning and career journey with EduPath Lanka.</p>
            </div>

            <form id="login-form" class="auth-form" novalidate>
                <div id="alert-message" class="alert hidden" role="alert"></div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                        <input class="auth-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <span class="error-msg" id="email-error"></span>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                        <input class="auth-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="toggle-pwd" aria-label="Show password">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="error-msg" id="password-error"></span>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </button>

                <p class="auth-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </form>
        </section>
    </main>

    <script type="module" src="theme.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
